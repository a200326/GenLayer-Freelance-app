<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Freelance Task Validator — GenLayer</title>
<style>
  :root {
    --blue: #110FFF;
    --dark: #070707;
    --panel: #111114;
    --border: #26262c;
    --text: #F5F5F5;
    --muted: #9a9aa2;
    --green: #00FF66;
    --red: #ff4d4d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--dark);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 24px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: var(--muted); margin-bottom: 24px; font-size: 14px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .card h2 { font-size: 15px; margin: 0 0 14px 0; color: var(--text); }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; margin-top: 12px; }
  input, textarea {
    width: 100%;
    background: #1a1a1f;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 9px 10px;
    font-size: 14px;
    font-family: inherit;
  }
  button {
    background: var(--blue);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
    margin-top: 14px;
    font-weight: 500;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.secondary { background: #2a2a30; }
  button.danger { background: #3a1414; color: var(--red); }
  #walletStatus {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #walletStatus button { margin-top: 0; }
  #disconnectBtn { margin-left: 8px; }
  #walletAddr { font-size: 13px; color: var(--muted); }
  .task {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 12px;
    font-size: 13px;
  }
  .task-row { display: flex; justify-content: space-between; margin-bottom: 6px; gap: 12px; }
  .task-label { color: var(--muted); white-space: nowrap; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .badge.open { background: #2a2a30; color: var(--muted); }
  .badge.submitted { background: #1a1a4d; color: #8888ff; }
  .badge.approved { background: #0a3d1f; color: var(--green); }
  .badge.disputed { background: #3d2a0a; color: #ffaa33; }
  .badge.resolved_worker_wins, .badge.resolved_client_wins { background: #0a3d1f; color: var(--green); }
  .task-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .task-actions button { margin-top: 0; padding: 7px 12px; font-size: 12px; }
  #log {
    font-size: 12px;
    color: var(--muted);
    white-space: pre-wrap;
    max-height: 160px;
    overflow-y: auto;
    background: #0c0c0f;
    border-radius: 6px;
    padding: 10px;
    margin-top: 10px;
    display: none;
  }
  a { color: var(--blue); }
</style>
</head>
<body>
<div class="wrap">

  <h1>Freelance Task Validator</h1>
  <div class="subtitle">Trustless freelance work verification, powered by GenLayer AI consensus.</div>

  <div class="card">
    <div id="walletStatus">
      <div id="walletAddr">Not connected</div>
      <div>
        <button id="connectBtn">Connect Wallet</button>
        <button id="disconnectBtn" class="secondary" style="display:none;">Disconnect</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Create a Task</h2>
    <label>Worker address (0x...)</label>
    <input id="workerInput" placeholder="0x..." />
    <label>Task description</label>
    <textarea id="descInput" rows="2" placeholder="e.g. Write a Python function that..."></textarea>
    <button id="createTaskBtn">Create Task</button>
  </div>

  <div class="card">
    <h2>Tasks <span id="taskCount" style="color:var(--muted); font-weight:400;"></span></h2>
    <button class="secondary" id="refreshBtn">Refresh</button>
    <div id="taskList" style="margin-top:14px;"></div>
  </div>

  <div id="log"></div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/genlayer-js@latest";
import { studionet } from "https://esm.sh/genlayer-js@latest/chains";

const CONTRACT_ADDRESS = "0xe8eE99A5991400bB6A94E43b889EC199F204F1ff";

let client = null;
let account = null;

const logEl = document.getElementById("log");
function log(msg) {
  logEl.style.display = "block";
  logEl.textContent += msg + "\n";
  logEl.scrollTop = logEl.scrollHeight;
}

async function connectWallet() {
  if (!window.ethereum) {
    alert("MetaMask not found. Please install the MetaMask extension.");
    return;
  }
  try {
    const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
    account = accounts[0];
    client = createClient({ chain: studionet, account: account });
    document.getElementById("walletAddr").textContent =
      account.slice(0, 6) + "..." + account.slice(-4);
    document.getElementById("connectBtn").style.display = "none";
    document.getElementById("disconnectBtn").style.display = "inline-block";
    log("Wallet connected: " + account);
    await loadTasks();
  } catch (e) {
    log("Connection failed: " + e.message);
  }
}

function disconnectWallet() {
  account = null;
  client = null;
  document.getElementById("walletAddr").textContent = "Not connected";
  document.getElementById("connectBtn").style.display = "inline-block";
  document.getElementById("connectBtn").textContent = "Connect Wallet";
  document.getElementById("connectBtn").disabled = false;
  document.getElementById("disconnectBtn").style.display = "none";
  log("Wallet disconnected. (This only clears the app's local session — to fully revoke access, remove the connection from MetaMask's \"Connected sites\" settings.)");
  loadTasks();
}

async function createTask() {
  if (!client) { alert("Connect your wallet first."); return; }
  const worker = document.getElementById("workerInput").value.trim();
  const description = document.getElementById("descInput").value.trim();
  if (!worker || !description) { alert("Fill in both fields."); return; }

  const btn = document.getElementById("createTaskBtn");
  btn.disabled = true;
  btn.textContent = "Confirm in MetaMask...";
  try {
    const hash = await client.writeContract({
      address: CONTRACT_ADDRESS,
      functionName: "create_task",
      args: [worker, description],
    });
    log("create_task sent: " + hash);
    btn.textContent = "Waiting for confirmation...";
    await client.waitForTransactionReceipt({ hash, status: "ACCEPTED" });
    log("create_task confirmed.");
    document.getElementById("workerInput").value = "";
    document.getElementById("descInput").value = "";
    await loadTasks();
  } catch (e) {
    log("create_task failed: " + e.message);
    alert("Transaction failed: " + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Create Task";
  }
}

async function callWrite(functionName, args, successMsg) {
  if (!client) { alert("Connect your wallet first."); return; }
  try {
    const hash = await client.writeContract({
      address: CONTRACT_ADDRESS,
      functionName,
      args,
    });
    log(functionName + " sent: " + hash);
    await client.waitForTransactionReceipt({ hash, status: "ACCEPTED" });
    log(successMsg || (functionName + " confirmed."));
    await loadTasks();
  } catch (e) {
    log(functionName + " failed: " + e.message);
    alert("Transaction failed: " + e.message);
  }
}

async function readContract(functionName, args = []) {
  const c = client || createClient({ chain: studionet });
  return await c.readContract({
    address: CONTRACT_ADDRESS,
    functionName,
    args,
  });
}

function parseTaskString(raw) {
  const parts = {};
  raw.split(" | ").forEach((chunk) => {
    const idx = chunk.indexOf(": ");
    if (idx > -1) {
      parts[chunk.slice(0, idx)] = chunk.slice(idx + 2);
    }
  });
  return parts;
}

async function loadTasks() {
  const listEl = document.getElementById("taskList");
  listEl.innerHTML = "<div style='color:var(--muted); font-size:13px;'>Loading...</div>";
  try {
    const count = await readContract("get_task_count");
    document.getElementById("taskCount").textContent = "(" + count + ")";

    if (Number(count) === 0) {
      listEl.innerHTML = "<div style='color:var(--muted); font-size:13px;'>No tasks yet.</div>";
      return;
    }

    let html = "";
    for (let i = Number(count) - 1; i >= 0; i--) {
      const rawTask = await readContract("get_task", [i]);
      const description = await readContract("get_description", [i]);
      const t = parseTaskString(rawTask);
      const isClient = account && t.client && t.client.toLowerCase() === account.toLowerCase();
      const isWorker = account && t.worker && t.worker.toLowerCase() === account.toLowerCase();

      let actions = "";
      if (isWorker && t.status === "open") {
        actions += `<button onclick="window.__submitEvidence(${i})">Submit Evidence</button>`;
      }
      if (isClient && t.status === "submitted") {
        actions += `<button onclick="window.__verify(${i})">Verify &amp; Resolve</button>`;
      }
      if (isClient && t.status === "approved") {
        actions += `<button class="secondary" onclick="window.__dispute(${i})">Raise Dispute</button>`;
      }
      if (isClient && t.status === "disputed") {
        actions += `<button class="danger" onclick="window.__resolveDispute(${i})">Resolve Dispute</button>`;
      }

      html += `
        <div class="task">
          <div class="task-row">
            <span class="task-label">Task #${i}</span>
            <span class="badge ${t.status}">${t.status || ""}</span>
          </div>
          <div class="task-row"><span class="task-label">Description</span><span>${escapeHtml(description)}</span></div>
          <div class="task-row"><span class="task-label">Client</span><span>${short(t.client)}</span></div>
          <div class="task-row"><span class="task-label">Worker</span><span>${short(t.worker)}</span></div>
          ${t.result ? `<div class="task-row"><span class="task-label">Result</span><span>${escapeHtml(t.result)}</span></div>` : ""}
          <div class="task-actions">${actions}</div>
        </div>
      `;
    }
    listEl.innerHTML = html;
  } catch (e) {
    listEl.innerHTML = "<div style='color:var(--red); font-size:13px;'>Failed to load tasks: " + e.message + "</div>";
  }
}

function short(addr) {
  if (!addr) return "-";
  return addr.slice(0, 6) + "..." + addr.slice(-4);
}
function escapeHtml(s) {
  if (!s) return "";
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

window.__submitEvidence = async (taskId) => {
  const url = prompt("Evidence URL (http/https):");
  if (!url) return;
  await callWrite("submit_evidence", [taskId, url], "Evidence submitted.");
};
window.__verify = async (taskId) => {
  await callWrite("verify_and_resolve", [taskId], "Verification complete.");
};
window.__dispute = async (taskId) => {
  const reason = prompt("Reason for dispute:");
  if (!reason) return;
  await callWrite("raise_dispute", [taskId, reason], "Dispute raised.");
};
window.__resolveDispute = async (taskId) => {
  await callWrite("resolve_dispute", [taskId], "Dispute resolved.");
};

document.getElementById("connectBtn").addEventListener("click", connectWallet);
document.getElementById("disconnectBtn").addEventListener("click", disconnectWallet);
document.getElementById("createTaskBtn").addEventListener("click", createTask);
document.getElementById("refreshBtn").addEventListener("click", loadTasks);

loadTasks();
</script>

</body>
</html>
